services:
  - type: web
    name: fashion-shop-bot
    env: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: ADMIN_USERNAMES
        value: xha.studio,lavaflows11
      - key: SHOP_URL
        value: https://xhastudio.github.io/SoneYay-Fashion-Studio2/
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: KBZPAY_NAME
        sync: false
      - key: KBZPAY_NUMBER
        sync: false
      - key: WAVEPAY_NAME
        sync: false
      - key: WAVEPAY_NUMBER
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
    # Render assigns PORT automatically; bot.py reads it and falls back to
    # API_PORT/8080 for local runs, so no PORT entry is needed here.
